<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback &mdash; NTC Admin</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand">
        <img src="https://formsphilippines.com/agencylogo/28.png" alt="NTC logo" class="brand__logo" />
        <div>
          <div class="brand__name">NTC Admin</div>
          <div class="brand__tagline">Guest Satisfaction</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="icon">&#9635;</span> Dashboard</a>
        <a href="feedback.html" class="active"><span class="icon">&#9776;</span> Feedback</a>
        <a href="analytics.html"><span class="icon">&#9673;</span> Analytics</a>
        <a href="reports.html"><span class="icon">&#9636;</span> Reports</a>
        <a href="questions.html"><span class="icon">&#9776;</span> Questions</a>
        <a href="settings.html"><span class="icon">&#9881;</span> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#" id="logout-link"><span class="icon">&#8594;</span> Logout</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h1>Feedback</h1>
        <div class="admin-topbar__user" id="admin-user-label">Administrator</div>
      </header>

      <main class="admin-content">
        <div class="page-heading">
          <div>
            <h2>Guest Feedback</h2>
            <p>All submitted survey responses, newest first.</p>
          </div>
        </div>

        <div id="feedback-error" class="form-error" hidden></div>

        <div class="card">
          <div id="feedback-loading" class="state-message">Loading responses&hellip;</div>
          <table class="table" id="feedback-table" hidden>
            <thead>
              <tr>
                <th>ID</th>
                <th>Submitted</th>
                <th>Overall Rating</th>
                <th>Comment</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="feedback-tbody"></tbody>
          </table>
          <div id="feedback-empty" class="state-message" hidden>No feedback submitted yet.</div>

          <div class="pagination" id="feedback-pagination" hidden>
            <span id="pagination-summary"></span>
            <div class="pagination__controls">
              <button type="button" id="btn-prev">&larr; Prev</button>
              <button type="button" id="btn-next">Next &rarr;</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/services/api.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/responseService.js"></script>
  <script src="../js/admin/adminShell.js"></script>
  <script src="../js/admin/feedback.js"></script>
</body>
</html>
