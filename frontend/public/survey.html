<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take the Survey &mdash; NTC Guest Satisfaction Portal</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/public.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="https://formsphilippines.com/agencylogo/28.png" alt="NTC logo" class="brand__logo" />
      <div>
        <div class="brand__name">National Telecommunications Commission</div>
        <div class="brand__tagline">Guest Satisfaction Portal</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="survey.html" class="active">Survey</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="survey-shell">
    <div id="survey-progress" class="survey-progress"></div>
    <div id="survey-step-label" class="survey-step-label"></div>

    <div id="survey-error" class="form-error" hidden></div>
    <div id="survey-loading" class="state-message">Loading survey&hellip;</div>

    <form id="survey-form" class="card" hidden>
      <div id="survey-question-container"></div>
      <div class="survey-actions">
        <button type="button" id="btn-back" class="btn btn-secondary" hidden>&larr; Back</button>
        <button type="submit" id="btn-next" class="btn btn-primary">Next &rarr;</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    &copy; <span id="year"></span> National Telecommunications Commission &mdash; Guest Satisfaction Portal
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="../js/services/api.js"></script>
  <script src="../js/services/questionService.js"></script>
  <script src="../js/services/responseService.js"></script>
  <script src="../js/public/survey.js"></script>
</body>
</html>
