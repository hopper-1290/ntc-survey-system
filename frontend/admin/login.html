<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login &mdash; NTC Guest Satisfaction</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        <img src="https://formsphilippines.com/agencylogo/28.png" alt="NTC logo" class="brand__logo" />
        <div>

        </div>
      </div>
      <h2>Sign in</h2>
      <p class="sub">GUEST SATISFACTION ADMIN</p>

      <div id="login-error" class="form-error" hidden></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <p class="login-hint">Demo credentials &mdash; username: <strong>admin</strong>, password: <strong>ntc-admin</strong></p>
    </div>
  </div>

  <script src="../js/services/api.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/admin/login.js"></script>
</body>
</html>
